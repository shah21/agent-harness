name: agent-run-shared

# Runs queued tasks for many private projects from one public runner repository.
# Everything a stranger can read here (run, job, step and artifact names, logs) stays neutral:
# no repository names, issue titles or project text. Output that could carry project content is
# encrypted before it is uploaded. See docs/shared-runner.md and
# docs/superpowers/specs/2026-10-31-shared-runner-design.md (section 6.1).
#
# Two kinds of job:
#   trusted    select, clone, publish. Only harness code runs. They hold the tokens.
#   untrusted  run. The agent and the project's own commands run. It holds no repository token
#              and no key that opens another project: only the Claude token, its own slot key
#              and the public half of the publish key.
# Each slot is its own set of three jobs with its own slot key, so a slot can only reference
# its own key. Do not edit this file by hand: it is generated by harness/lib/shared-workflow.mjs.
#
# The caller must not set a workflow-level concurrency group: a slow project would hold up the
# others. The select job serialises selection itself, and a running label keeps one project to
# one task at a time.

on:
  workflow_call:
    inputs:
      harness_repo:
        type: string
        required: true
      harness_ref:
        type: string
        default: v1
      caller_workflow:
        type: string
        default: runner.yml
      projects_path:
        type: string
        default: runner/projects.json
      node_version:
        type: string
        default: '22'
      claude_code_version:
        type: string
        default: '2.1.283'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN_2:
        required: false
      # JSON: { "<owner>": ["<token>", ...] }, fine-grained first, classic last.
      RUNNER_TOKENS:
        required: true
      # 16+ characters; seals the selection for the trusted jobs.
      RUN_KEY:
        required: true
      # The private repository that holds the project list and the run records.
      STORE_REPO:
        required: true
      STORE_TOKEN:
        required: true
      # An X25519 key pair made with: node harness/cli.mjs keygen --out <dir>. The run job gets
      # only the public half; only publish gets the private half.
      PUBLISH_PUBLIC_KEY:
        required: true
      PUBLISH_PRIVATE_KEY:
        required: true
      # One per slot, 16+ random characters each. They name the handoff artifacts.
      SLOT_KEY_0:
        required: true
      SLOT_KEY_1:
        required: true
      SLOT_KEY_2:
        required: true

jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: selection
      cancel-in-progress: false
    outputs:
      attempt: ${{ github.run_attempt }}
      count: ${{ steps.select.outputs.count }}
      more: ${{ steps.select.outputs.more }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ inputs.harness_ref }}
          path: .harness
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Select
        id: select
        env:
          RUNNER_TOKENS: ${{ secrets.RUNNER_TOKENS }}
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
          STORE_REPO: ${{ secrets.STORE_REPO }}
          PROJECTS_PATH: ${{ inputs.projects_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: node .harness/harness/shared-select.mjs --store-repo "$STORE_REPO" --projects-path "$PROJECTS_PATH" --out "$RUNNER_TEMP/sel" >> "$GITHUB_OUTPUT"

      - name: Encrypt the selection
        if: steps.select.outputs.count != '0'
        env:
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: node .harness/harness/cli.mjs encrypt --dir "$RUNNER_TEMP/sel" --out "$RUNNER_TEMP/selection.enc" --aad "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload the selection
        if: steps.select.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selection.enc
          retention-days: 1

  clone_0:
    name: clone 0
    needs: select
    if: needs.select.result == 'success' && fromJSON(needs.select.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse a partial re-run
        if: needs.select.outputs.attempt != github.run_attempt
        run: |
          echo "Re-run all jobs, not only the failed ones: the selection belongs to an earlier attempt."
          exit 1

      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ inputs.harness_ref }}
          path: .harness
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Download the selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enc

      - name: Open the selection
        id: entry
        env:
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: |
          node .harness/harness/cli.mjs decrypt --in "$RUNNER_TEMP/enc/selection.enc" --dir "$RUNNER_TEMP/sel" --aad "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$RUNNER_TEMP/bundle"
          node .harness/harness/cli.mjs shared-entry --selections "$RUNNER_TEMP/sel/selections.json" --index 0 --out "$RUNNER_TEMP/bundle" >> "$GITHUB_OUTPUT"

      # The tokens live in this step only, and nothing in this job runs project code.
      - name: Clone
        if: steps.entry.outputs.skipped == 'false'
        env:
          RUNNER_TOKENS: ${{ secrets.RUNNER_TOKENS }}
        run: bash .harness/harness/shared-clone.sh "$RUNNER_TEMP/bundle/entry.json" "$RUNNER_TEMP/bundle/project"

      - name: Names
        id: names
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
        run: echo "bundle=$(node .harness/harness/cli.mjs tag --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --label bundle)" >> "$GITHUB_OUTPUT"

      - name: Wait for the run job's public key
        timeout-minutes: 30
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
          GH_TOKEN: ${{ github.token }}
        run: bash .harness/harness/wait-artifact.sh pub "$RUNNER_TEMP/run.pub" 1700

      # A name is only secret until the artifact exists, so the key is accepted only with a proof
      # that a holder of this slot's key made it.
      - name: Check the run job's public key
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
        run: |
          [ "$(wc -l < "$RUNNER_TEMP/run.pub" | tr -d ' ')" = 2 ] || { echo "handoff rejected"; exit 1; }
          head -n 1 "$RUNNER_TEMP/run.pub" > "$RUNNER_TEMP/run.key"
          tail -n 1 "$RUNNER_TEMP/run.pub" > "$RUNNER_TEMP/run.pub.proof"
          node .harness/harness/cli.mjs proof-check --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --slot 0 --label pub --data-file "$RUNNER_TEMP/run.key" --proof-file "$RUNNER_TEMP/run.pub.proof" || { echo "handoff rejected"; exit 1; }

      - name: Sign the bundle and seal it to that key
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
        run: |
          node .harness/harness/cli.mjs proof --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --slot 0 --label bundle --data-file "$RUNNER_TEMP/bundle/entry.json" > "$RUNNER_TEMP/bundle/slot.proof"
          node .harness/harness/cli.mjs seal --dir "$RUNNER_TEMP/bundle" --out "$RUNNER_TEMP/bundle.sealed" --key-file "$RUNNER_TEMP/run.key" --aad "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:0" --allow-links

      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ steps.names.outputs.bundle }}
          path: ${{ runner.temp }}/bundle.sealed
          retention-days: 1

  run_0:
    name: run 0
    needs: select
    if: needs.select.result == 'success' && fromJSON(needs.select.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse a partial re-run
        if: needs.select.outputs.attempt != github.run_attempt
        run: |
          echo "Re-run all jobs, not only the failed ones: the selection belongs to an earlier attempt."
          exit 1

      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ inputs.harness_ref }}
          path: .harness
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Names
        id: names
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
        run: |
          echo "pub=$(node .harness/harness/cli.mjs tag --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --label pub)" >> "$GITHUB_OUTPUT"
          echo "out=$(node .harness/harness/cli.mjs tag --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --label out)" >> "$GITHUB_OUTPUT"

      # The private key exists in this job only and is never uploaded. The public key goes up
      # first, signed with the slot key, before anything slow runs.
      - name: Make a key pair for this job and sign the public key
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
        run: |
          node .harness/harness/cli.mjs keygen --out "$RUNNER_TEMP/keys"
          {
            cat "$RUNNER_TEMP/keys/public.key"
            node .harness/harness/cli.mjs proof --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --slot 0 --label pub --data-file "$RUNNER_TEMP/keys/public.key"
          } > "$RUNNER_TEMP/pub.txt"

      - name: Publish the public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pub-${{ steps.names.outputs.pub }}
          path: ${{ runner.temp }}/pub.txt
          retention-days: 1

      - name: Install tooling
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        run: |
          corepack enable
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Wait for the bundle
        timeout-minutes: 30
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
          GH_TOKEN: ${{ github.token }}
        run: bash .harness/harness/wait-artifact.sh bundle "$RUNNER_TEMP/bundle.sealed" 1700

      - name: Open the bundle
        id: entry
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
        run: |
          node .harness/harness/cli.mjs open --in "$RUNNER_TEMP/bundle.sealed" --dir "$RUNNER_TEMP/open" --key-file "$RUNNER_TEMP/keys/private.key" --aad "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:0" --allow-links
          rm -f "$RUNNER_TEMP/keys/private.key"
          # Anyone can seal to our public key; only the clone job of this slot can sign.
          node .harness/harness/cli.mjs proof-check --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --slot 0 --label bundle --data-file "$RUNNER_TEMP/open/entry.json" --proof-file "$RUNNER_TEMP/open/slot.proof" || { echo "bundle rejected"; exit 1; }
          mkdir -p "$RUNNER_TEMP/agent"
          for f in entry.json selection.json issue.json target-checkout.txt; do
            if [ -f "$RUNNER_TEMP/open/$f" ]; then mv "$RUNNER_TEMP/open/$f" "$RUNNER_TEMP/agent/$f"; fi
          done
          if [ -d "$RUNNER_TEMP/open/project" ]; then mv "$RUNNER_TEMP/open/project" project; fi
          if [ "$(jq -r 'if .selection.skip then "true" else "false" end' "$RUNNER_TEMP/agent/entry.json")" = true ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # Branch names and issue numbers are read from the entry inside the script: an env value
      # would be printed in the public log.
      - name: Read config from the default branch
        if: steps.entry.outputs.skipped == 'false'
        run: |
          entry="$RUNNER_TEMP/agent/entry.json"
          git -C project show "origin/$(jq -r .defaultBranch "$entry"):agent.config.json" > "$RUNNER_TEMP/agent/default.agent.config.json" 2>/dev/null

      - name: Note a missing target token
        if: steps.entry.outputs.skipped == 'false'
        run: |
          if [ -n "$(jq -r '.target.error // empty' "$RUNNER_TEMP/agent/entry.json")" ]; then
            echo "target configured but no usable token" > "$RUNNER_TEMP/agent/target-checkout.txt"
          fi

      # The step timeout sits inside the job's so the bundle, seal and upload steps below still
      # run when the agent overruns.
      - name: Run task
        if: steps.entry.outputs.skipped == 'false'
        timeout-minutes: 135
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
        run: >-
          node .harness/harness/run-task.mjs
          --project project
          --issue "$RUNNER_TEMP/agent/issue.json"
          --out "$RUNNER_TEMP/agent"
          --base-branch "$(jq -r .selection.base "$RUNNER_TEMP/agent/entry.json")"
          --config "$RUNNER_TEMP/agent/default.agent.config.json"
          --selection "$RUNNER_TEMP/agent/selection.json" >/dev/null 2>&1

      - name: Bundle the agent branch
        if: always() && steps.entry.outputs.skipped == 'false'
        run: |
          entry="$RUNNER_TEMP/agent/entry.json"
          ISSUE="$(jq -r .selection.issue.number "$entry")"
          BASE="$(jq -r .selection.base "$entry")"
          branch="agent/issue-$ISSUE"
          rm -f "$RUNNER_TEMP/agent/branch.bundle"
          if git -C project rev-parse -q --verify "refs/heads/$branch" >/dev/null 2>&1 \
            && [ "$(git -C project rev-list --count "origin/$BASE..refs/heads/$branch" 2>/dev/null)" -gt 0 ]; then
            git -C project bundle create "$RUNNER_TEMP/agent/branch.bundle" "refs/heads/$branch" >/dev/null 2>&1
          fi

      # Sealed to the publish key: this job can encrypt with it but never decrypt.
      - name: Seal the run output
        if: always()
        env:
          SEAL_PUBLIC_KEY: ${{ secrets.PUBLISH_PUBLIC_KEY }}
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
        run: |
          find "$RUNNER_TEMP/agent" -type l -delete
          verdict="$RUNNER_TEMP/agent/verdict.json"
          [ -f "$verdict" ] || verdict=""
          node .harness/harness/cli.mjs proof --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --slot 0 --label out ${verdict:+--data-file "$verdict"} > "$RUNNER_TEMP/agent/slot.proof"
          node .harness/harness/cli.mjs seal --dir "$RUNNER_TEMP/agent" --out "$RUNNER_TEMP/run-output.sealed" --aad "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:0"

      - name: Upload the sealed output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-${{ steps.names.outputs.out }}
          path: ${{ runner.temp }}/run-output.sealed
          if-no-files-found: warn
          retention-days: 3

  publish_0:
    name: publish 0
    needs: [select, clone_0, run_0]
    if: always() && needs.select.result == 'success' && fromJSON(needs.select.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse a partial re-run
        if: needs.select.outputs.attempt != github.run_attempt
        run: |
          echo "Re-run all jobs, not only the failed ones: the selection belongs to an earlier attempt."
          exit 1

      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ inputs.harness_ref }}
          path: .harness
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Download the selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enc

      - name: Open the selection
        env:
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: |
          node .harness/harness/cli.mjs decrypt --in "$RUNNER_TEMP/enc/selection.enc" --dir "$RUNNER_TEMP/sel" --aad "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node .harness/harness/cli.mjs shared-entry --selections "$RUNNER_TEMP/sel/selections.json" --index 0 --out "$RUNNER_TEMP/selection-files" >/dev/null

      # The output is checked twice: it opens only with the publish key, and only this slot's
      # jobs can have created the artifact.
      - name: Open the run output
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_0 }}
          GH_TOKEN: ${{ github.token }}
          OPEN_PRIVATE_KEY: ${{ secrets.PUBLISH_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/agent"
          if bash .harness/harness/wait-artifact.sh out "$RUNNER_TEMP/run-output.sealed" 0; then
            node .harness/harness/cli.mjs open --in "$RUNNER_TEMP/run-output.sealed" --dir "$RUNNER_TEMP/agent" --aad "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:0" || { echo "run output could not be opened"; chmod -R u+rwX "$RUNNER_TEMP/agent" 2>/dev/null || true; rm -rf "$RUNNER_TEMP/agent"; mkdir -p "$RUNNER_TEMP/agent"; }
            # Anyone can seal to the public publish key; only a holder of this slot's key can sign.
            verdict="$RUNNER_TEMP/agent/verdict.json"
            [ -f "$verdict" ] || verdict=""
            if ! { [ -f "$RUNNER_TEMP/agent/slot.proof" ] && node .harness/harness/cli.mjs proof-check --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --slot 0 --label out ${verdict:+--data-file "$verdict"} --proof-file "$RUNNER_TEMP/agent/slot.proof"; }; then
              rm -rf "$RUNNER_TEMP/agent"
              mkdir -p "$RUNNER_TEMP/agent"
              echo "run output rejected"
            fi
          else
            echo "no run output"
          fi

      # Nothing in the run's verdict decides where a token is used: the guard takes the issue,
      # branch, base and task from the trusted selection and checks every target against it.
      - name: Publish result
        env:
          RUNNER_TOKENS: ${{ secrets.RUNNER_TOKENS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          entry="$RUNNER_TEMP/selection-files/entry.json"
          sel="$RUNNER_TEMP/selection-files/selection.json"
          token_for() { jq -r --arg o "$1" --argjson i "$2" '.[$o][$i] // empty' <<<"$RUNNER_TOKENS"; }
          GH_TOKEN="$(token_for "$(jq -r .tokenOwner "$entry")" "$(jq -r .tokenIndex "$entry")")"
          echo "::add-mask::$GH_TOKEN"
          if [ -n "$(jq -r '.target.repo // empty' "$entry")" ] && [ -z "$(jq -r '.target.error // empty' "$entry")" ]; then
            TARGET_PUSH_TOKEN="$(token_for "$(jq -r .target.tokenOwner "$entry")" "$(jq -r .target.tokenIndex "$entry")")"
            echo "::add-mask::$TARGET_PUSH_TOKEN"
            export TARGET_PUSH_TOKEN
          fi
          export GH_TOKEN REPO="$(jq -r .repo "$entry")" RUN_URL
          export VERDICT="$RUNNER_TEMP/publish-verdict.json" BUNDLE="$RUNNER_TEMP/agent/branch.bundle" BUNDLE_DIR="$RUNNER_TEMP/agent"
          if [ "$(jq -r '.selection.skip // empty' "$entry")" != "" ]; then
            node .harness/harness/cli.mjs skip-verdict --selection "$sel" > "$VERDICT"
          elif [ -f "$RUNNER_TEMP/agent/verdict.json" ]; then
            node .harness/harness/cli.mjs guard-verdict --verdict "$RUNNER_TEMP/agent/verdict.json" --entry "$entry" --bundle-dir "$RUNNER_TEMP/agent" > "$VERDICT"
          else
            node .harness/harness/cli.mjs fallback-verdict --selection "$sel" > "$VERDICT"
          fi
          # publish.sh ends with a line that names the pull request, and gh and git errors name
          # the repository: keep every byte of it out of the public log.
          if bash .harness/harness/publish.sh >"$RUNNER_TEMP/publish.log" 2>&1; then
            echo "published"
          else
            echo "publish failed"
            exit 1
          fi

      - name: Record run
        if: always()
        env:
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
          STORE_REPO: ${{ secrets.STORE_REPO }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [ -f "$RUNNER_TEMP/publish-verdict.json" ] || exit 0
          node .harness/harness/store-record.mjs --verdict "$RUNNER_TEMP/publish-verdict.json" --entry "$RUNNER_TEMP/selection-files/entry.json" --run-id "$RUN_ID" || true

  clone_1:
    name: clone 1
    needs: select
    if: needs.select.result == 'success' && fromJSON(needs.select.outputs.count) > 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse a partial re-run
        if: needs.select.outputs.attempt != github.run_attempt
        run: |
          echo "Re-run all jobs, not only the failed ones: the selection belongs to an earlier attempt."
          exit 1

      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ inputs.harness_ref }}
          path: .harness
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Download the selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enc

      - name: Open the selection
        id: entry
        env:
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: |
          node .harness/harness/cli.mjs decrypt --in "$RUNNER_TEMP/enc/selection.enc" --dir "$RUNNER_TEMP/sel" --aad "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$RUNNER_TEMP/bundle"
          node .harness/harness/cli.mjs shared-entry --selections "$RUNNER_TEMP/sel/selections.json" --index 1 --out "$RUNNER_TEMP/bundle" >> "$GITHUB_OUTPUT"

      # The tokens live in this step only, and nothing in this job runs project code.
      - name: Clone
        if: steps.entry.outputs.skipped == 'false'
        env:
          RUNNER_TOKENS: ${{ secrets.RUNNER_TOKENS }}
        run: bash .harness/harness/shared-clone.sh "$RUNNER_TEMP/bundle/entry.json" "$RUNNER_TEMP/bundle/project"

      - name: Names
        id: names
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_1 }}
        run: echo "bundle=$(node .harness/harness/cli.mjs tag --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --label bundle)" >> "$GITHUB_OUTPUT"

      - name: Wait for the run job's public key
        timeout-minutes: 30
        env:
          SLOT_KEY: ${{ secrets.SLOT_KEY_1 }}
          GH_TOKEN: ${{ github.token }}
