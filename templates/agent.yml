name: agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:

# One select → run → publish chain at a time per repository.
concurrency:
  group: agent-${{ github.repository }}
  cancel-in-progress: false

# Keep harness_ref equal to the @ref in `uses:` below.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent'
    uses: OWNER/agent-harness/.github/workflows/run-task.yml@v1
    with:
      harness_repo: OWNER/agent-harness
      harness_ref: v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
