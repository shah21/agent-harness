name: agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
  # Resumes tasks paused by usage limits (label agent:waiting). Hourly at :30,
  # 16:30–02:30 UTC (move it to your night); each check that finds nothing ends in
  # seconds but bills one Actions minute, so keep the window narrow.
  schedule:
    - cron: '30 16-23,0-2 * * *'

# One select → run → publish chain at a time per repository.
concurrency:
  group: agent-${{ github.repository }}
  cancel-in-progress: false

# Keep harness_ref equal to the @ref in `uses:` below.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  agent:
    if: github.event_name != 'issues' || github.event.label.name == 'agent'
    uses: OWNER/agent-harness/.github/workflows/run-task.yml@v1
    with:
      harness_repo: OWNER/agent-harness
      harness_ref: v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional: a second account used when the first runs out of usage.
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
